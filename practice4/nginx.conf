pid logs/nginx.pid;
error_log logs/nginx-error.log info;
events { worker_connections 1024; }
http {
    access_log logs/nginx-access.log;
    upstream grpcservers { server 127.0.0.1:50051; }
    server {
        listen 127.0.0.1:9448 ssl http2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate certs/server.pem;
        ssl_certificate_key certs/server-key.pem;
        ssl_client_certificate certs/ca.pem;
        ssl_verify_client on;
        location / { grpc_pass grpc://grpcservers; }
    }
}
