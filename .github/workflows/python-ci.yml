name: Python CI
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  python-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pylint
        run: python -m pip install pylint==3.3.8
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Pylint
        shell: bash
        run: |
          set -o pipefail
          python -m pylint calculator.py tests --fail-under=9.0 | tee lint.txt
      - name: Save lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: lint.txt
